name: Build JsonQ Extension

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }} for PHP ${{ matrix.php }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        php: ['8.1', '8.2', '8.3', '8.4']
        # Note: Windows is excluded due to unresolved linker issues with
        # ext-php-rs and the PHP devel pack (vs16). The PHP symbols in php8.lib
        # are not properly resolved by either MSVC link.exe or rust-lld.
        # See: https://github.com/davidcole1340/ext-php-rs/issues

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: phpize
          ini-values: memory_limit=-1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> $GITHUB_ENV
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: Configure linker flags (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [target.aarch64-apple-darwin]
          rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]

          [target.x86_64-apple-darwin]
          rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]
          EOF

      - name: Build Extension
        run: cargo build --release

      - name: Run Tests
        run: |
          if [ -f target/release/libjsonq.so ]; then
            EXT=target/release/libjsonq.so
          elif [ -f target/release/libjsonq.dylib ]; then
            EXT=target/release/libjsonq.dylib
          fi
          if [ -n "$EXT" ]; then
            php -d "extension=$(pwd)/$EXT" tests/run_tests.php
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jsonq-${{ matrix.os }}-php${{ matrix.php }}
          path: |
            target/release/libjsonq.so
            target/release/libjsonq.dylib
          if-no-files-found: ignore