name: Build JsonQ Extension

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }} for PHP ${{ matrix.php }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: phpize
          ini-values: memory_limit=-1

      - name: Setup Rust (stable)
        if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust (nightly for Windows)
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@nightly

      - name: Configure rust-lld linker (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [target.x86_64-pc-windows-msvc]
          linker = "rust-lld"
          EOF

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> $GITHUB_ENV
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: Build Extension
        run: cargo build --release

      - name: Run Tests (Linux & macOS)
        if: runner.os != 'Windows'
        run: |
          if [ -f target/release/libjsonq.so ]; then
            EXT=target/release/libjsonq.so
          elif [ -f target/release/libjsonq.dylib ]; then
            EXT=target/release/libjsonq.dylib
          fi
          if [ -n "$EXT" ]; then
            php -d "extension=$(pwd)/$EXT" tests/run_tests.php
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jsonq-${{ matrix.os }}-php${{ matrix.php }}
          path: |
            target/release/libjsonq.so
            target/release/libjsonq.dylib
            target/release/jsonq.dll
          if-no-files-found: ignore