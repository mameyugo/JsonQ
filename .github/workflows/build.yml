name: Build & Release JsonQ Extension

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: PHP ${{ matrix.php }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        php: ['8.1', '8.2', '8.3', '8.4']
        # Windows excluded: ext-php-rs has unresolved linker issues with php8.lib

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: phpize
          ini-values: memory_limit=-1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev dpkg-dev

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> $GITHUB_ENV
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: Configure linker flags (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [target.aarch64-apple-darwin]
          rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]

          [target.x86_64-apple-darwin]
          rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]
          EOF

      - name: Build Extension
        run: cargo build --release

      - name: Detect platform info
        id: platform
        run: |
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m)
          # Normalize arch names
          case "$ARCH" in
            x86_64)  ARCH="x86_64" ;;
            aarch64) ARCH="arm64" ;;
            arm64)   ARCH="arm64" ;;
          esac
          echo "os=$OS" >> $GITHUB_OUTPUT
          echo "arch=$ARCH" >> $GITHUB_OUTPUT

      - name: Prepare release artifact
        id: artifact
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/' | tr -d '\r')
          OS="${{ steps.platform.outputs.os }}"
          ARCH="${{ steps.platform.outputs.arch }}"
          PHP="${{ matrix.php }}"

          # Determine extension file
          if [ -f target/release/libjsonq.so ]; then
            SRC="target/release/libjsonq.so"
            EXT="so"
          elif [ -f target/release/libjsonq.dylib ]; then
            SRC="target/release/libjsonq.dylib"
            EXT="dylib"
          else
            echo "ERROR: No compiled extension found!"
            find target/release -maxdepth 1 -name "*jsonq*" | head -10
            exit 1
          fi

          # Name following convention: jsonq-v{version}-{os}-{arch}-php{version}.{ext}
          ARTIFACT_NAME="jsonq-v${VERSION}-${OS}-${ARCH}-php${PHP}.${EXT}"

          mkdir -p dist
          cp "$SRC" "dist/${ARTIFACT_NAME}"

          echo "src=$SRC" >> $GITHUB_OUTPUT
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          echo "✅ Artifact: $ARTIFACT_NAME ($(ls -lh dist/$ARTIFACT_NAME | awk '{print $5}'))"

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit (Hydrator — pure PHP)
        run: vendor/bin/phpunit --testsuite Hydrator --testdox

      - name: Run PHPUnit (HydratableStore — native extension)
        run: |
          php -d "extension=$(pwd)/${{ steps.artifact.outputs.src }}" vendor/bin/phpunit --testsuite HydratableStore --testdox

      - name: Run Legacy Integration Tests
        run: |
          php -d "extension=$(pwd)/${{ steps.artifact.outputs.src }}" tests/run_tests.php

      - name: Run Streaming Integration Tests
        run: |
          php -d "extension=$(pwd)/${{ steps.artifact.outputs.src }}" tests/integration/test_streaming.php

      - name: Run Hydrator Integration Tests
        run: |
          php -d "extension=$(pwd)/${{ steps.artifact.outputs.src }}" tests/integration/test_hydrator.php

      - name: Build .deb package (Linux only)
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/build-deb.sh
          PHP="${{ matrix.php }}"
          ARCH=$(dpkg --print-architecture)
          ./scripts/build-deb.sh "$PHP" "$ARCH"
          echo "✅ .deb built:"
          ls -lh build/out/*.deb

      - name: Upload .deb artifact (Linux only)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: deb-php${{ matrix.php }}-${{ steps.platform.outputs.arch }}
          path: build/out/*.deb
          if-no-files-found: error

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: dist/${{ steps.artifact.outputs.artifact_name }}
          if-no-files-found: error

  # ─── Create GitHub Release on version tags or manual dispatch ───
  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: false

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Tag push - use the tag as-is
            TAG="${{ github.ref_name }}"
          else
            # Manual dispatch - extract version from Cargo.toml
            VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/' | tr -d '\r')
            TAG="v${VERSION}"
            echo "⚠️  Note: If release $TAG already exists, it will be updated"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "📌 Release tag: $TAG"

      - name: Prepare release files
        run: |
          mkdir -p release
          # Collect .so and .dylib binaries
          find release-assets -type f \( -name "*.so" -o -name "*.dylib" \) -exec cp {} release/ \;
          # Collect .deb packages
          find release-assets -type f -name "*.deb" -exec cp {} release/ \;
          echo "📦 Release files:"
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: release/*
          body: |
            ## Installation

            ### Linux — .deb package (easiest)

            ```bash
            # Auto-detect your PHP version and architecture
            PHP_VER=$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')
            ARCH=$(dpkg --print-architecture)
            wget "https://github.com/mameyugo/JsonQ/releases/download/${{ steps.tag.outputs.tag }}/php${PHP_VER}-jsonq_*_${ARCH}.deb"
            sudo dpkg -i php${PHP_VER}-jsonq_*_${ARCH}.deb
            sudo apt-get install -f
            ```

            ### Linux — manual .so

            ```bash
            sudo cp jsonq-v*-linux-x86_64-php8.3.so $(php-config --extension-dir)/jsonq.so
            echo 'extension=jsonq.so' | sudo tee /etc/php/8.3/mods-available/jsonq.ini
            sudo phpenmod -v 8.3 jsonq
            ```

            ### macOS

            ```bash
            sudo cp jsonq-v*-macos-arm64-php8.3.dylib $(php-config --extension-dir)/jsonq.so
            echo 'extension=jsonq.so' > $(php --ini | grep 'Loaded Configuration' | awk '{print $NF}')
            ```

            ### Verify

            ```bash
            php -m |  grep jsonq
            php -r "echo jsonq_version();"
            ```