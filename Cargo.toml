[package]
name = "jsonq"
version = "0.2.0"
edition = "2021"
authors = ["Mameyugo <info@mameyugo.com>"]
description = "High-performance JSON file storage engine for PHP, powered by Rust"
license = "MIT"
repository = "https://github.com/mameyugo/JsonQ.git"
homepage = "https://github.com/mameyugo/JsonQ"
documentation = "https://github.com/mameyugo/JsonQ/blob/main/docs/API.md"
readme = "README.md"
keywords = ["php", "json", "storage", "database", "extension"]
categories = ["database", "filesystem"]
rust-version = "1.75"

[lib]
crate-type = ["cdylib", "rlib"]
name = "jsonq"

[dependencies]
ext-php-rs = "0.15.6"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
simd-json = "0.13"
memmap2 = "0.9"
home = "=0.5.9"
bincode = "1.3"
md5 = "0.7"
fs2 = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.10"
zstd = { version = "0.13", optional = true }
flate2 = { version = "1.0", optional = true }

[features]
default = []
compression = ["zstd", "flate2"]
safe-regex = []

[dev-dependencies]
tempfile = "3.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 1
