[package]
name = "rjson"
version = "0.0.1"
edition = "2021"
authors = ["Mamel <mamel@rjson.dev>"]
description = "High-performance JSON file storage engine for PHP, powered by Rust"
license = "MIT"

[lib]
crate-type = ["cdylib"]
name = "rjson"

[dependencies]
ext-php-rs = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
